{% set name = "skein" %}
{% set version = "0.8.2" %}
{% set pkg_loc = "py3" %}

package:
  name: {{ name|lower }}
  version: {{ version }}

source:
  # The wheel is used rather than the sdist because the sdist does not ship the
  # prebuilt skein.jar; building it from source needs a full Maven/JDK toolchain.
  url: https://files.pythonhosted.org/packages/{{ pkg_loc }}/{{ name[0] }}/{{ name }}/{{ name }}-{{ version }}-{{ pkg_loc }}-none-any.whl
  sha256: c76287ead9e81bbb2882d8eb26f51ac72d0f08403cabfce77ae23debda0138aa

build:
  number: 0
  skip: True  # [win]
  script:
    - python -m pip install --no-deps --ignore-installed {{ name }}-{{ version }}-{{ pkg_loc }}-none-any.whl
    - cp {{ SP_DIR }}/{{ name }}-{{ version }}.dist-info/LICENSE {{ SRC_DIR }}/LICENSE
  entry_points:
    - skein = skein.cli:main

requirements:
  host:
    - python
    - pip
  run:
    - python
    - cryptography
    # 0.8.2 declares `grpcio !=1.45.0,>=1.11.0`; mirrors upstream metadata.
    - grpcio >=1.11.0,!=1.45.0
    - protobuf >=3.5.0
    - pyyaml

test:
  imports:
    - skein
    - skein.proto
    - skein.recipes
  commands:
    - skein --help

about:
  home: https://jcrist.github.io/skein/
  license: BSD-3-Clause
  license_family: BSD
  license_file: LICENSE
  summary: A simple tool and library for deploying applications on Apache YARN
  doc_url: https://jcrist.github.io/skein/
  dev_url: https://github.com/jcrist/skein

extra:
  recipe-maintainers:
    - jcrist
